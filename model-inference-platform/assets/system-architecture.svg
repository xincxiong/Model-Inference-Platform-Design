<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 20px; font-weight: 600; fill: #111827; }
    .label { font-size: 13px; fill: #111827; }
    .label-bold { font-size: 13px; font-weight: 600; fill: #111827; }
    .sub-label { font-size: 11px; fill: #6b7280; }
    .layer-label { font-size: 11px; font-weight: 600; fill: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="960" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" class="title">Model Inference Platform — System Architecture</text>

  <!-- Layer: Access Layer -->
  <text x="30" y="76" class="layer-label">Access Layer</text>
  <rect x="30" y="85" rx="12" ry="12" width="900" height="110" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="100" y="115" width="170" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="185" y="137" text-anchor="middle" class="label-bold">Web Console</text>
  <text x="185" y="155" text-anchor="middle" class="sub-label">React 19 + Next.js 15</text>
  <rect x="310" y="115" width="170" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="395" y="137" text-anchor="middle" class="label-bold">Responses API</text>
  <text x="395" y="155" text-anchor="middle" class="sub-label">/v1/responses + /v1/messages</text>
  <rect x="520" y="115" width="170" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="605" y="137" text-anchor="middle" class="label-bold">Chat Completions</text>
  <text x="605" y="155" text-anchor="middle" class="sub-label">/v1/chat/completions</text>
  <rect x="730" y="115" width="170" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="815" y="137" text-anchor="middle" class="label-bold">CLI / SDK</text>
  <text x="815" y="155" text-anchor="middle" class="sub-label">Go CLI + Python/JS SDK</text>

  <!-- Layer: Gateway &amp; Routing -->
  <text x="30" y="226" class="layer-label">Gateway &amp; Routing</text>
  <rect x="30" y="235" rx="12" ry="12" width="900" height="100" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="80" y="265" width="170" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="285" text-anchor="middle" class="label-bold">API Gateway</text>
  <text x="165" y="302" text-anchor="middle" class="sub-label">Kong / Envoy</text>
  <rect x="290" y="265" width="170" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="285" text-anchor="middle" class="label-bold">Auth Service</text>
  <text x="375" y="302" text-anchor="middle" class="sub-label">JWT / API Key</text>
  <rect x="500" y="265" width="170" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="285" text-anchor="middle" class="label-bold">Rate Limiter</text>
  <text x="585" y="302" text-anchor="middle" class="sub-label">Redis sliding window</text>
  <rect x="710" y="265" width="170" height="50" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="285" text-anchor="middle" class="label-bold">Smart Router</text>
  <text x="795" y="302" text-anchor="middle" class="sub-label">BERT complexity scoring</text>

  <!-- Layer: Control Plane -->
  <text x="30" y="366" class="layer-label">Control Plane (Management :8081)</text>
  <rect x="30" y="375" rx="12" ry="12" width="900" height="190" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="55" y="400" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="125" y="426" text-anchor="middle" class="label">User / Team</text>
  <rect x="220" y="400" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="290" y="426" text-anchor="middle" class="label">Billing</text>
  <rect x="385" y="400" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="455" y="426" text-anchor="middle" class="label">Endpoint Mgmt</text>
  <rect x="550" y="400" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="620" y="426" text-anchor="middle" class="label">Model Registry</text>
  <rect x="715" y="400" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="785" y="426" text-anchor="middle" class="label">Load Balancer</text>
  <rect x="55" y="465" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="125" y="491" text-anchor="middle" class="label">Fine-tune Sched</text>
  <rect x="220" y="465" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="290" y="491" text-anchor="middle" class="label">A/B Testing</text>
  <rect x="385" y="465" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="455" y="491" text-anchor="middle" class="label">Budget Alerts</text>
  <rect x="550" y="465" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="620" y="491" text-anchor="middle" class="label">Semantic Cache</text>
  <rect x="715" y="465" width="140" height="46" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="785" y="491" text-anchor="middle" class="label">Data Validator</text>

  <!-- Layer: Data Plane -->
  <text x="30" y="596" class="layer-label">Data Plane (Inference :8080)</text>
  <rect x="30" y="605" rx="12" ry="12" width="900" height="110" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="60" y="630" width="170" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="652" text-anchor="middle" class="label-bold">Multi-Engine Router</text>
  <text x="145" y="670" text-anchor="middle" class="sub-label">vLLM / SGLang / Mock</text>
  <rect x="270" y="630" width="170" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="652" text-anchor="middle" class="label-bold">Dedicated Endpoints</text>
  <text x="355" y="670" text-anchor="middle" class="sub-label">HAMi GPU isolation</text>
  <rect x="480" y="630" width="170" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="652" text-anchor="middle" class="label-bold">Batch Workers</text>
  <text x="565" y="670" text-anchor="middle" class="sub-label">Low-priority idle GPU</text>
  <rect x="690" y="630" width="170" height="56" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="652" text-anchor="middle" class="label-bold">Fine-tune Cluster</text>
  <text x="775" y="670" text-anchor="middle" class="sub-label">Volcano + Megatron-LM</text>

  <!-- Layer: Storage -->
  <text x="30" y="726" class="layer-label">Storage &amp; Data</text>
  <rect x="30" y="735" rx="12" ry="12" width="900" height="70" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="70" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="130" y="765" text-anchor="middle" class="label">PostgreSQL 16</text>
  <text x="130" y="779" text-anchor="middle" class="sub-label">metadata</text>
  <rect x="215" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="275" y="765" text-anchor="middle" class="label">Redis 7</text>
  <text x="275" y="779" text-anchor="middle" class="sub-label">cache / rate limit</text>
  <rect x="360" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="420" y="765" text-anchor="middle" class="label">S3 / MinIO</text>
  <text x="420" y="779" text-anchor="middle" class="sub-label">models / datasets</text>
  <rect x="505" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="565" y="765" text-anchor="middle" class="label">ClickHouse</text>
  <text x="565" y="779" text-anchor="middle" class="sub-label">analytics</text>
  <rect x="650" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="710" y="765" text-anchor="middle" class="label">Kafka</text>
  <text x="710" y="779" text-anchor="middle" class="sub-label">event stream</text>
  <rect x="795" y="748" width="120" height="38" rx="6" ry="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="855" y="765" text-anchor="middle" class="label">LanceDB</text>
  <text x="855" y="779" text-anchor="middle" class="sub-label">vector / AI data</text>

  <!-- Arrows: Access → Gateway -->
  <line x1="185" y1="171" x2="165" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="400" y1="171" x2="375" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="610" y1="171" x2="585" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="815" y1="171" x2="795" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrows: Gateway → Control Plane -->
  <line x1="250" y1="335" x2="290" y2="400" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="450" y1="335" x2="455" y2="400" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="640" y1="335" x2="620" y2="400" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Arrows: Control Plane → Data Plane -->
  <path d="M 125 511 C 125 570 145 570 145 630" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 290 511 C 290 570 355 570 355 630" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 455 511 C 455 570 565 570 565 630" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 785 511 C 785 570 775 570 775 630" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Arrows: Data Plane → Storage -->
  <line x1="145" y1="686" x2="130" y2="748" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="355" y1="686" x2="275" y2="748" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="565" y1="686" x2="565" y2="748" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="775" y1="686" x2="855" y2="748" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Side label: Orchestration -->
  <rect x="30" y="440" width="14" height="260" rx="7" ry="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="23" y="465" text-anchor="end" class="sub-label" style="writing-mode:vertical-rl;transform:rotate(180deg) translate(-6px, 0);">Volcano + HAMi</text>
  <text x="23" y="500" text-anchor="end" class="sub-label" style="writing-mode:vertical-rl;transform:rotate(180deg) translate(-6px, 0);">KEDA / HPA</text>

  <!-- Side label: Observability -->
  <rect x="916" y="440" width="14" height="260" rx="7" ry="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="937" y="470" text-anchor="start" class="sub-label" style="writing-mode:vertical-rl;">Prometheus</text>
  <text x="937" y="505" text-anchor="start" class="sub-label" style="writing-mode:vertical-rl;">Grafana / OTel</text>

  <path d="M 44 570 C 44 590 60 590 60 605" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Legend -->
  <g transform="translate(30, 800)">
    <rect x="0" y="0" width="520" height="14" rx="4" fill="#f9fafb"/>
    <line x1="10" y1="7" x2="40" y2="7" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="46" y="11" fill="#6b7280" font-size="10">Client request</text>
    <line x1="140" y1="7" x2="170" y2="7" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="176" y="11" fill="#6b7280" font-size="10">Control / management</text>
    <line x1="310" y1="7" x2="340" y2="7" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="346" y="11" fill="#6b7280" font-size="10">Inference data flow</text>
    <line x1="460" y1="7" x2="490" y2="7" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <text x="496" y="11" fill="#6b7280" font-size="10">Storage / persistence</text>
  </g>
</svg>