<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-label="Model Inference Platform">
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="136" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="44" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="80" y1="52" x2="80" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded tile -->
  <rect x="12" y="12" width="136" height="136" rx="36" fill="url(#bg)"/>
  <rect x="12" y="12" width="136" height="136" rx="36" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Subtle inner glow -->
  <ellipse cx="80" cy="88" rx="52" ry="40" fill="url(#glow)"/>
  <!-- Cloud / inference plane arc -->
  <path d="M38 96c0-18 16-32 42-32s42 14 42 32" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Central node (endpoint) -->
  <circle cx="80" cy="98" r="10" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
  <!-- Upstream model nodes -->
  <circle cx="52" cy="58" r="7" fill="url(#accent)" filter="url(#soft)"/>
  <circle cx="80" cy="46" r="7" fill="url(#accent)" filter="url(#soft)"/>
  <circle cx="108" cy="58" r="7" fill="url(#accent)" filter="url(#soft)"/>
  <!-- Routes: model ’ inference -->
  <path d="M52 65 L72 88" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M80 53 L80 88" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M108 65 L88 88" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Motion hint -->
  <path d="M80 28v10" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M74 34l6-8 6 8" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
