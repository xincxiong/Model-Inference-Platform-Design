apiVersion: v1
kind: Namespace
metadata:
  name: inference-platform
  labels:
    app.kubernetes.io/name: inference-platform
    app.kubernetes.io/part-of: model-inference-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: hami-system
  labels:
    app.kubernetes.io/name: hami-system
    app.kubernetes.io/part-of: model-inference-platform
---
# ServiceAccount for backend pods to query HAMi scheduler
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-backend
  namespace: inference-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-platform-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # HAMi resource access
  - apiGroups: ["hami.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-platform-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-platform-reader
subjects:
  - kind: ServiceAccount
    name: inference-backend
    namespace: inference-platform
