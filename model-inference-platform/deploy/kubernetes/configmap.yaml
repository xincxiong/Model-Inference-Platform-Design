apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-platform-config
  namespace: inference-platform
data:
  # Backend runtime config
  GIN_MODE: "release"
  SERVER_PORT: "8080"
  DATABASE_URL: "postgres://inference:inference123@postgres-svc.inference-platform.svc.cluster.local:5432/inference_platform?sslmode=disable"
  REDIS_URL: "redis://redis-svc.inference-platform.svc.cluster.local:6379"
  KAFKA_BROKERS: "kafka-svc.inference-platform.svc.cluster.local:9092"

  # ── Inference Engine Configuration ────────────────────────────────────
  # Primary engine: vllm or sglang (default: vllm)
  INFERENCE_ENGINE: "vllm"

  # vLLM endpoint (OpenAI-compatible API on port 8000)
  VLLM_ENDPOINT: "http://vllm-svc.inference-platform.svc.cluster.local:8000"

  # SGLang endpoint (OpenAI-compatible API on port 30000)
  # Uncomment to enable SGLang as primary or secondary engine
  # SGLANG_ENDPOINT: "http://sglang-svc.inference-platform.svc.cluster.local:30000"

  # Custom engine per-model override (format: CUSTOM_ENGINE_<MODEL_ID>=<URL>)
  # Example: deploy a specialized model on a separate vLLM instance
  # CUSTOM_ENGINE_deepseek-ai/DeepSeek-R1: "http://deepseek-r1-vllm.inference-platform.svc.cluster.local:8000"

  # ── HAMi Scheduler Configuration ──────────────────────────────────────
  HAMI_SCHEDULER_ENDPOINT: "http://hami-scheduler.hami-system.svc.cluster.local:9090"
  HAMI_ENABLED: "true"

  # vLLM worker configuration
  VLLM_WORKER_POOL_SIZE: "4"

  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.inference-platform.svc.cluster.local:4318"
  PROMETHEUS_ENDPOINT: "http://prometheus.inference-platform.svc.cluster.local:9090"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: inference-platform
data:
  NEXT_PUBLIC_API_URL: "http://backend-svc.inference-platform.svc.cluster.local:8080"
  NODE_ENV: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: inference-platform
data:
  init.sql: |
    -- Handled by Go migrations (store.RunMigrations)
    -- This placeholder ensures the ConfigMap can be mounted as initdb scripts
    SELECT 1;
